<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{fragments/layout}">
<div layout:fragment="content">

    <h2 class="mb-4">회원가입</h2>

    <!-- Flash 메시지 출력 -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
	
    <form th:action="@{/users/join}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
        <input type="hidden" name="provider" value="local">
        
        <div class="mb-3">
            <input type="hidden" name="provider" class="form-control" value="thejao703">
            <label for="email" class="form-label">이메일</label>
            <input type="email" id="email" name="email" class="form-control" 
            		placeholder="example@email.com" required>
			<div class="iddouble_result"></div>	
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" id="nickname" name="nickname" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="mobile" class="form-label">휴대폰 번호</label>
            <input type="text" id="mobile" name="mobile" class="form-control" placeholder="010-1234-5678">
        </div>

        <div class="mb-3">
            <label for="file" class="form-label">프로필 이미지</label>
            <input type="file" id="file" name="file" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">회원가입</button>
    </form>

    <p class="mt-3">
        이미 계정이 있으신가요?
        <a th:href="@{/users/login}">로그인</a>
    </p>
	<script>
			$(function(){
				//1. 대상찾아오기   아이디가 이메일의 값을 찾아오려고함. 
					console.log( "1. " +  (0 ==  false )   );   // true   자동형변환
					console.log( "2. " +  (0 === false )   );   // false  자료형까지
					console.log( "3. " +  (0 ==  "" )   );   // true   자동형변환
					console.log( "4. " +  (0 === "" )   );   // false  자료형까지 
					
				$("#email").on("keyup" , function(){
					console.log( $(this).val().trim() ); 
					let keyword = $(this).val().trim();
 
					
					if(keyword === ""){// 만약 빈칸인지 검사
						$(".iddouble_result").empty().append("<span  class='text-danger p-3'>이메일을 입력해주세요</span>");
						return;
					}else{ // 아니라면 ajax  - iddouble /POST / email / 
						$.ajax({
							url:"iddouble",
							type:"GET",  //## post는 무조건 인증해야함.
							data:{email : keyword , provider : "local"} , 
							success:function( res ){  //res = {cnt: 1}
								console.log(res);  
								if(res.cnt == 1 ){
									$(".iddouble_result").empty().append("<span  class='text-danger p-3'>이미 사용중인 이메일입니다.</span>");
								}else{
									$(".iddouble_result").empty().append("<span  class='text-success p-3'>사용가능한 이메일입니다.</span>");
								}
							} ,
							error:function( ){
								$(".iddouble_result").empty().append("<span  class='text-danger p-3'>서버요청 중 오류가 발생했습니다.</span>");
							}
						});
					}
				}); 
			});
	</script>	
</div>
</body>
</html>
