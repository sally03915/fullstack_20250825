<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{fragments/layout}">
<body>
	<div layout:fragment="content">

		<h2 class="mb-4">마이페이지</h2>

		<!-- 메시지 출력 -->
		<div th:if="${errorMessage}" class="alert alert-danger"
			th:text="${errorMessage}"></div>
		<div th:if="${successMessage}" class="alert alert-success"
			th:text="${successMessage}"></div>
		<p th:text="${loginSuccessMessage}"></p>

		<!-- 로그인된 사용자 -->
		<div sec:authorize="isAuthenticated()">
			<div class="p-3">
				<table class="table table-bordered align-middle">
					<tbody>
						<tr>
							<!-- 프로필 이미지 -->
							<td rowspan="4" class="text-center fw-bold fs-3 table-primary" style="width: 25%;">
								<img th:if="${dto != null and dto.ufile != null}" th:src="@{'/upload/' + ${dto.ufile}}" alt="프로필" style="max-width: 150px;">
								<img th:if="${dto == null or dto.ufile == null}"  th:src="@{'/images/thejoa.png'}" 
									alt="랜덤 프로필" style="max-width: 150px;"></td>
							<th style="width: 20%;">이메일</th>
							<td
								th:text="${dto != null ? dto.email : #authentication.principal.attributes['email']}"></td>
						</tr>
						<tr>
							<th>닉네임</th>
							<td
								th:text="${dto != null && dto.nickname != null ? dto.nickname : #authentication.principal.attributes['nickname']}"></td>
						</tr>
						<tr>
							<th>휴대폰</th>
							<td><span th:if="${dto != null and dto.mobile != null}"
								th:text="${dto.mobile}"></span>
								<button th:if="${dto == null or dto.mobile == null}"
									class="btn btn-secondary btn-sm">휴대폰 인증</button></td>
						</tr>
						<tr>
							<th>소셜로그인</th>
							<td><span
								th:text="${dto != null ? dto.provider : #authentication.principal.attributes['provider']}"></span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="mt-3">
				<!-- 로컬 계정만 정보 수정 버튼 표시 -->
				<div th:if="${dto != null and dto.provider == 'local'}">
					<a th:href="@{/users/update}" class="btn btn-warning">정보 수정</a>
					<form th:action="@{/users/delete}" method="post" class="d-inline">
						<input type="hidden" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}" />
						<button type="submit" class="btn btn-danger">회원 탈퇴</button>
					</form>
				</div>

				<!-- 소셜 계정은 탈퇴만 가능 (dto가 null이어도 표시) -->
				<div th:if="${dto == null or dto.provider != 'local'}">
					<form th:action="@{/users/delete}" method="post" class="d-inline">
						<input type="hidden" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}" />
						<button type="submit" class="btn btn-danger">회원 탈퇴</button>
					</form>
				</div>
			</div>

		</div>

		<!-- 익명 사용자 -->
		<div sec:authorize="isAnonymous()">
			<p class="alert alert-warning">로그인 후 이용 가능한 페이지입니다.</p>
			<a th:href="@{/users/login}" class="btn btn-primary">로그인</a>
		</div>

	</div>
</body>
</html>
