<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head lang="ko">
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>
<th:block th:fragment="header">
    <!-- 상단 배너 -->
    <div class="p-5 bg-primary text-white text-center">
        <h1>My First Bootstrap 5 Page</h1>
        <p>Resize this responsive page to see the effect!</p>
    </div>

    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/board/list}" sec:authorize="isAnonymous()">BOARD</a>
                </li>
            </ul>

            <ul class="d-flex navbar-nav">
                <!-- 로그인하지 않은 사용자 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/users/login}">LOGIN</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/users/join}">JOIN</a>
                </li>

                <!-- 로그인한 사용자 -->
                <li class="nav-item"  sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/users/logout}">LOGOUT</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/users/mypage}" 
                       sec:authentication="principal.username"></a>
                </li>
            </ul>
        </div>
    </nav>
</th:block>
</body>
</html>
