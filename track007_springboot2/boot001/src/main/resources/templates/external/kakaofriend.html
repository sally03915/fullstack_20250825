<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>카카오 친구 목록</title>
</head>
<body>
<h1>친구 목록</h1>
<ul>
    <li th:each="friend : ${friends}">
        <span th:text="${friend.nickname}"></span>
        <a th:href="@{/kakao/send(uuid=${friend.uuid})}">메시지 보내기</a>
    </li>
</ul>
</body>
</html>
