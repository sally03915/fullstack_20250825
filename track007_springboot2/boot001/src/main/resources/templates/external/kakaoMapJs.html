<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>현재 위치 기반 매장 추천</title> 

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=668d3271e4f5e9d45ec7f4a12b001802&libraries=services"></script>
 <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h2 class="mb-3">📍 현재 위치 기반 매장 추천</h2>

  <!-- 버튼 영역 -->
  <div class="mb-3">
    <button id="locateBtn" class="btn btn-primary me-2">내 위치 찾기</button>
    <button id="showAllBtn" class="btn btn-secondary">모든 매장 표시</button>
  </div>

  <!-- 지도 영역 -->
  <div id="map" class="border rounded" style="width:100%; height:500px;"></div>

  <!-- 결과 패널 -->
  <div class="card mt-3">
    <div class="card-body">
      <h5 class="card-title">추천 결과</h5>
      <p id="resultText" class="card-text">아직 위치를 찾지 않았습니다.</p>
      <div id="storeList" class="list-group"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // DOMContentLoaded 이벤트가 발생한 뒤에만 실행
    document.addEventListener("DOMContentLoaded", function() {

      // 매장 좌표 데이터 (DB 연동 가능)
      const stores = [
        { name: "강남점", lat: 37.498095, lng: 127.027610 },
        { name: "홍대점", lat: 37.556343, lng: 126.922651 },
        { name: "인천점", lat: 37.447275, lng: 126.690894 },
        { name: "시청점", lat: 37.566295, lng: 126.977945 }
      ];

      // 지도 초기화 (서울 시청 중심)
      const map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
      });

      // 사용자 위치 마커
      const userMarker = new kakao.maps.Marker({ zIndex: 9999 });

      // 거리 계산 함수 (Haversine 공식)
      function haversine(lat1, lng1, lat2, lng2) {
        const R = 6371; // 지구 반지름 (km)
        const toRad = deg => deg * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat/2)**2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                  Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      // 모든 매장 표시
      function showStores() {
        stores.forEach(store => {
          const pos = new kakao.maps.LatLng(store.lat, store.lng);
          new kakao.maps.Marker({ position: pos, map });
        });
        document.getElementById("resultText").textContent = "모든 매장을 지도에 표시했습니다.";
      }

      // 현재 위치 찾기 + 가장 가까운 매장 추천
      function locateAndRecommend() {
        if (!navigator.geolocation) {
          alert("브라우저가 위치 정보를 지원하지 않습니다.");
          return;
        }

        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const userPos = new kakao.maps.LatLng(lat, lng);

          // 사용자 위치 마커 표시
          userMarker.setPosition(userPos);
          userMarker.setMap(map);
          map.setCenter(userPos);

          // 가장 가까운 매장 찾기
          let nearest = null;
          stores.forEach(store => {
            const dist = haversine(lat, lng, store.lat, store.lng);
            if (!nearest || dist < nearest.dist) {
              nearest = { ...store, dist };
            }
          });

          // 결과 표시
          if (nearest) {
            document.getElementById("resultText").innerHTML =
              `가장 가까운 매장: <span class="text-primary fw-bold">${nearest.name}</span> (${nearest.dist.toFixed(2)} km)`;

            // 매장 리스트 출력
            document.getElementById("storeList").innerHTML =
              stores.map(s => {
                const d = haversine(lat, lng, s.lat, s.lng).toFixed(2);
                const activeClass = s.name === nearest.name ? "active" : "";
                return `<div class="list-group-item ${activeClass}">${s.name} - ${d} km</div>`;
              }).join("");
          }
        });
      }

      // 버튼 이벤트 연결
      document.getElementById("locateBtn").onclick = locateAndRecommend;
      document.getElementById("showAllBtn").onclick = showStores;

    });
  </script>
</body>
</html>
