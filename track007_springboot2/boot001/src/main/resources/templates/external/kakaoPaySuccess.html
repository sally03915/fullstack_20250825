<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head lang="ko">
    <meta charset="UTF-8">
    <title>결제 성공</title>
    <!-- Bootstrap CSS 추가 -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content" class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">카카오페이 결제가 성공적으로 완료되었습니다 🎉</h3>
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <tbody>
                    <tr>
                        <th scope="row">승인 번호</th>
                        <td th:text="${result.aid}"></td>
                    </tr>
                    <tr>
                        <th scope="row">결제 금액</th>
                        <td><span th:text="${result.total}"></span> 원</td>
                    </tr>
                    <tr>
                        <th scope="row">부가세</th>
                        <td><span th:text="${result.vat}"></span> 원</td>
                    </tr>
                    <tr>
                        <th scope="row">상태</th>
                        <td><span th:text="${result.status}"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-center">
            <a href="/" class="btn btn-primary">메인으로 돌아가기</a>
        </div>
    </div>

</div>
<!-- Bootstrap JS (선택사항) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
