<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>서비스 적용 화면 예시</title>
  <script type="text/javascript"
          src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cb7675e4f0818096685e09204e33fc6a"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h2>📍 위치 기반 서비스</h2>
  <p>주소 검색 및 매장 안내 기능을 제공합니다.</p>

  <!-- 주소 검색 -->
  <h3>주소 검색 및 위치 확인</h3>
  <input type="text" id="address" placeholder="주소 입력">
  <button id="searchBtn">검색</button>

  <!-- 매장 안내 -->
  <h3>매장/지점 안내</h3>
  <button id="loadStoresBtn">매장 위치 불러오기</button>

  <!-- 지도 영역 -->
  <div id="map" style="width:700px;height:500px;margin-top:20px;"></div>

  <script>
    var container = document.getElementById('map');
    var options = {
      center: new kakao.maps.LatLng(37.5665, 126.9780), // 초기 서울 좌표
      level: 3
    };
    var map = new kakao.maps.Map(container, options);
    var marker = new kakao.maps.Marker();

    // 주소 검색 기능
    $("#searchBtn").click(function() {
      var address = $("#address").val();

      $.ajax({
        url: "/map/geo",
        type: "GET",
        data: { address: address },
        success: function(data) {
          if (data.documents && data.documents.length > 0) {
            var x = data.documents[0].x;
            var y = data.documents[0].y;

            var coords = new kakao.maps.LatLng(y, x);

            map.setCenter(coords);
            marker.setPosition(coords);
            marker.setMap(map);
          } else {
            alert("주소를 찾을 수 없습니다.");
          }
        },
        error: function() {
          alert("서버 호출 중 오류 발생");
        }
      });
    });

    // 매장 안내 기능 (예시용 매장 데이터)
    $("#loadStoresBtn").click(function() {
      var stores = [
        { name: "강남점", address: "서울 강남구 테헤란로 123" },
        { name: "홍대점", address: "서울 마포구 양화로 45" },
        { name: "인천점", address: "인천 남동구 예술로 100" }
      ];

      stores.forEach(function(store) {
        $.ajax({
          url: "/map/geo",
          type: "GET",
          data: { address: store.address },
          success: function(data) {
            if (data.documents && data.documents.length > 0) {
              var x = data.documents[0].x;
              var y = data.documents[0].y;
              var coords = new kakao.maps.LatLng(y, x);

              var storeMarker = new kakao.maps.Marker({
                position: coords,
                map: map
              });

              var infowindow = new kakao.maps.InfoWindow({
                content: "<div style='padding:5px;font-size:12px;'>" + store.name + "</div>"
              });
              infowindow.open(map, storeMarker);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
