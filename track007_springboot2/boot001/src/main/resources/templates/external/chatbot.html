<script>
  (function(){
    var w=window;
    if(w.ChannelIO){return w.console.error("ChannelIO script included twice.");}
    var ch=function(){ch.c(arguments);};
    ch.q=[];
    ch.c=function(args){ch.q.push(args);};
    w.ChannelIO=ch;
    function l(){
      if(w.ChannelIOInitialized){return;}
      w.ChannelIOInitialized=true;
      var s=document.createElement("script");
      s.type="text/javascript";
      s.async=true;
      s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";
      var x=document.getElementsByTagName("script")[0];
      if(x.parentNode){x.parentNode.insertBefore(s,x);}
    }
    if(document.readyState==="complete"){l();}
    else{
      w.addEventListener("DOMContentLoaded",l);
      w.addEventListener("load",l);
    }
  })();

  // -------------------------------
  // 1. 로그인 후 자동 연결
  // 로그인 성공 시 사용자 정보 전달
  function bootChannel(user) {
    ChannelIO('boot', {
      pluginKey: "a73e776e-c216-4090-a753-a65bbe854207",   // 채널에서 발급받은 고유 키
      memberId: user.id,             // 로그인한 사용자의 고유 ID
      profile: {                     // 상담원이 확인할 수 있는 사용자 프로필
        name: user.name,
        email: user.email,
        mobileNumber: user.phone
      },
      //hideChannelButton: false,      // 기본 버튼 노출 여부
      locale: "ko"                   // 챗봇 언어 설정 (한국어)
    });
  }

  // -------------------------------
  // 2. 로그아웃 시 챗봇 초기화
  function shutdownChannel() {
    ChannelIO('shutdown');           // 세션 종료 → 다른 사용자 정보가 남지 않도록 처리
  }

  // -------------------------------
  // 3. 특정 페이지에서만 챗봇 노출
  // 예: 결제 페이지에서는 숨기고, 나머지 페이지에서는 노출
  if (window.location.pathname === "/checkout") {
    ChannelIO('shutdown');           // 결제 페이지에서는 챗봇 숨김
  } else {
    ChannelIO('boot', { pluginKey: "a73e776e-c216-4090-a753-a65bbe854207" });
  }

  // -------------------------------
  // 4. 커스텀 버튼으로 챗봇 열기
  // 기본 우측 하단 버튼 대신 특정 DOM 요소를 런처로 지정
 
  ChannelIO('boot', {
    pluginKey: "a73e776e-c216-4090-a753-a65bbe854207",
    customLauncherSelector: "#chat-launcher" // 사이트 내 버튼 ID
  });
 
  // -------------------------------
  // 5. 사용자 행동 기반 이벤트 전달
  // 예: 상품 구매 완료 시 이벤트 트래킹
  function trackPurchase(productId, price) {
    ChannelIO('track', 'purchase', {
      productId: productId,
      price: price
    });
  }
</script>
